name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, formatação, tipagem e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks precisa do histórico

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --group dev

      - name: pre-commit (ruff, gitleaks, shellcheck, mypy)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sincronizar dependências
        run: uv sync --group dev

      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  compose:
    name: Validar docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # O compose só existe a partir do M7; até lá o job passa sem fazer nada.
      - name: docker compose config
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose --env-file .env.example config --quiet
          else
            echo "Sem docker-compose.yml ainda (chega no M7) - nada a validar."
          fi
